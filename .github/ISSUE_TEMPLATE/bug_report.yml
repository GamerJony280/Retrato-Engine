name: Bug report
description: Report a reproducible engine or compiler problem.
title: "[Bug] "
body:
  - type: textarea
    id: environment
    attributes:
      label: Version and environment
      description: Commit/release, OS, architecture, compiler, backend and driver. Omit private usernames and paths.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide a minimal input and commands. Remove credentials and personal data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized diagnostics
      description: Optional. Review paths, email addresses and tokens before posting.
      render: text
